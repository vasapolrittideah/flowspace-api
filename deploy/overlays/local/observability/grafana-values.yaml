# Values for the grafana-community/grafana chart. Grafana has no persistent
# volume and no anonymous access. Developers open it with kubectl port-forward.
admin:
  existingSecret: grafana-admin
automountServiceAccountToken: false
rbac:
  create: false
testFramework:
  enabled: false
initChownData:
  enabled: false
grafana.ini:
  analytics:
    reporting_enabled: false
    check_for_updates: false
    check_for_plugin_updates: false
  auth.anonymous:
    enabled: false
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        isDefault: true
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
            tags:
              - key: service.name
                value: service
            filterByTraceID: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
        jsonData:
          derivedFields:
            - name: trace_id
              matcherType: regex
              matcherRegex: '"trace_id":"([0-9a-f]{32})"'
              datasourceUid: tempo
              url: "$${__value.raw}"
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server
# Grafana 13 registers its API groups at startup, which needs about one CPU
# for a few minutes. The startup probe keeps the liveness probe from
# restarting it during that time.
startupProbe:
  httpGet:
    path: /api/health
    port: grafana
  periodSeconds: 10
  failureThreshold: 60
# With a dashboard open, Grafana uses up to 450Mi of its own memory, and its
# file cache fills the rest of the limit. At 512Mi, the container stayed at
# its limit, requests timed out, and the liveness probe restarted Grafana.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 1Gi
# Git holds the Flowspace dashboards. The chart mounts the ConfigMap from the
# kustomization, and the provider loads it into the Flowspace folder.
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: flowspace
        orgId: 1
        folder: Flowspace
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards/flowspace
dashboardsConfigMaps:
  flowspace: grafana-dashboards-flowspace
