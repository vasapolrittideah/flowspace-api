fullnameOverride: keycloak

command:
  - /opt/keycloak/bin/kc.sh
  - start-dev
  - --import-realm

extraEnv: |
  - name: KC_BOOTSTRAP_ADMIN_USERNAME
    value: admin
  - name: KC_BOOTSTRAP_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-admin
        key: password
  - name: KC_HOSTNAME
    value: http://localhost:8080/auth
  - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
    value: "true"

extraVolumes: |
  - name: realm
    secret:
      secretName: keycloak-realm
      items:
        - key: realm
          path: flowspace-realm.json

extraVolumeMounts: |
  - name: realm
    mountPath: /opt/keycloak/data/import
    readOnly: true

cache:
  stack: custom

# ponytail: local-only H2; add PostgreSQL in the identity persistence slice.
database:
  vendor: dev-file

proxy:
  enabled: false
  http:
    enabled: false

secrets:
  admin:
    stringData: {}
  realm:
    stringData: {}
