# Values for the grafana/alloy chart. Alloy receives OTLP over gRPC from
# Flowspace pods, sends the spans to Tempo, and writes the metrics to
# Prometheus. It also reads the logs of Flowspace pods through the Kubernetes
# API and sends them to Loki.
crds:
  create: false
alloy:
  enableReporting: false
  configMap:
    content: |
      discovery.kubernetes "flowspace_pods" {
        role = "pod"
        namespaces {
          own_namespace = true
        }
        selectors {
          role  = "pod"
          label = "app.kubernetes.io/part-of=flowspace"
        }
      }

      // A line that is not JSON keeps the service label from the pod name
      // label. A JSON line replaces it with its service field.
      discovery.relabel "flowspace_pods" {
        targets = discovery.kubernetes.flowspace_pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "service"
        }
      }

      loki.source.kubernetes "flowspace_pods" {
        targets    = discovery.relabel.flowspace_pods.output
        forward_to = [loki.process.flowspace_pods.receiver]
      }

      loki.process "flowspace_pods" {
        stage.json {
          expressions = {
            service     = "",
            environment = "",
          }
        }
        stage.labels {
          values = {
            service     = "",
            environment = "",
          }
        }
        stage.label_keep {
          values = ["service", "environment", "namespace"]
        }
        forward_to = [loki.write.loki.receiver]
      }

      loki.write "loki" {
        endpoint {
          url = "http://loki:3100/loki/api/v1/push"
        }
      }

      otelcol.receiver.otlp "default" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }
        output {
          traces  = [otelcol.processor.memory_limiter.default.input]
          metrics = [otelcol.processor.memory_limiter.default.input]
        }
      }

      // The exporter queue keeps spans while Tempo is down. Above 256MiB of
      // heap, the limiter refuses new spans and the services drop them. With
      // Tempo down, Alloy stayed near 294Mi of its 512Mi limit and stayed
      // ready. Before the limiter, Alloy rose to 510Mi and failed its
      // readiness probe. scripts/smoke-alloy-memory-local.sh tests this behavior.
      otelcol.processor.memory_limiter "default" {
        check_interval = "1s"
        limit          = "320MiB"
        spike_limit    = "64MiB"
        output {
          traces  = [otelcol.exporter.otlp.tempo.input]
          metrics = [otelcol.processor.transform.service_labels.input]
        }
      }

      // Each service series carries the service and environment labels of
      // the specification, from the same resource values as the spans.
      otelcol.processor.transform "service_labels" {
        error_mode = "ignore"
        metric_statements {
          context    = "datapoint"
          statements = [
            `set(attributes["service"], resource.attributes["service.name"])`,
            `set(attributes["environment"], resource.attributes["deployment.environment.name"])`,
          ]
        }
        output {
          metrics = [otelcol.exporter.prometheus.prometheus.input]
        }
      }

      // The exporter turns dots into underscores and adds the unit and
      // _total suffixes. If enabled, target_info copies the resource into
      // one more series that no dashboard reads.
      otelcol.exporter.prometheus "prometheus" {
        include_target_info = false
        forward_to          = [prometheus.remote_write.prometheus.receiver]
      }

      prometheus.remote_write "prometheus" {
        endpoint {
          url = "http://prometheus-server/api/v1/write"
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo:4317"
          tls {
            insecure = true
          }
        }
      }
  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
configReloader:
  enabled: false
controller:
  type: deployment
# Alloy reads pods and their logs in its own namespace only.
rbac:
  create: true
  namespaces:
    - flowspace-local
  rules:
    - apiGroups: [""]
      resources: ["pods", "pods/log"]
      verbs: ["get", "list", "watch"]
  clusterRules: []
