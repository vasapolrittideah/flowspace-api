version: '3.9'

vars:
  BUF_VERSION: v1.54.0
  CLUSTER_NAME: flowspace
  REGISTRY_PORT: 5001
  SQLC_VERSION: v1.31.1

tasks:
  default:
    desc: Show available tasks
    silent: true
    cmds:
      - task --list

  cluster:create:
    desc: Create the local k3d cluster
    cmds:
      - k3d cluster create {{.CLUSTER_NAME | shellQuote}} --registry-create {{printf "%s-registry.localhost:0.0.0.0:%v" .CLUSTER_NAME .REGISTRY_PORT | shellQuote}}

  cluster:delete:
    desc: Delete the local k3d cluster
    cmds:
      - k3d cluster delete {{.CLUSTER_NAME | shellQuote}}

  cluster:start:
    desc: Start the local k3d cluster
    cmds:
      - k3d cluster start {{.CLUSTER_NAME | shellQuote}}

  cluster:stop:
    desc: Stop the local k3d cluster
    cmds:
      - k3d cluster stop {{.CLUSTER_NAME | shellQuote}}

  buf:
    desc: Run the pinned Buf CLI
    cmds:
      - go run github.com/bufbuild/buf/cmd/buf@{{.BUF_VERSION}} {{.CLI_ARGS}}

  sqlc:
    desc: Run the pinned sqlc CLI
    cmds:
      - go run github.com/sqlc-dev/sqlc/cmd/sqlc@{{.SQLC_VERSION}} {{.CLI_ARGS}}

  fmt:
    desc: Format Go code
    cmds:
      - golangci-lint fmt

  format:check:
    desc: Check Go formatting
    cmds:
      - golangci-lint fmt --diff

  lint:
    desc: Lint Go code
    cmds:
      - golangci-lint run ./...

  constraints:floor:
    desc: Reject changes that weaken the quality floor
    cmds:
      - node scripts/constraint-check.mjs floor

  coverage:
    desc: Test and enforce coverage constraints
    cmds:
      - |
        profile="$(mktemp)"
        trap 'rm -f "$profile"' EXIT
        go test ./... -coverprofile="$profile"
        node scripts/constraint-check.mjs coverage --profile "$profile" --changed-min 80 --total-min 25

  secrets:
    desc: Scan the working tree for secrets
    cmds:
      - go run github.com/zricethezav/gitleaks/v8@v8.18.4 detect --no-git --source . --redact --no-banner

  secrets:setup:
    desc: Create local password files without replacing existing values
    cmds:
      - |
        node --input-type=module <<'NODE'
        import { randomBytes } from 'node:crypto';
        import { chmodSync, existsSync, mkdirSync, writeFileSync } from 'node:fs';
        mkdirSync('.secrets', { recursive: true, mode: 0o700 });
        chmodSync('.secrets', 0o700);
        for (const name of ['keycloak-admin-password', 'workspace-database-password']) {
          const path = `.secrets/${name}`;
          if (!existsSync(path)) {
            writeFileSync(path, randomBytes(32).toString('hex'), { flag: 'wx', mode: 0o600 });
          }
          chmodSync(path, 0o600);
        }
        NODE

  secrets:local-test:
    desc: Test local secret paths and Git and Docker exclusions
    cmds:
      - node --test scripts/local-secrets.test.mjs

  vuln:
    desc: Scan reachable Go dependencies for vulnerabilities
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  check:fast:
    desc: Run sub-five-second edit checks
    cmds:
      - node --test scripts/constraint-check.test.mjs
      - task: constraints:floor
      - task: format:check
      - task: secrets

  check:task:
    desc: Run all local handoff checks
    cmds:
      - task: check:fast
      - task: lint
      - |
        status=0
        task coverage || status=1
        task vuln || status=1
        if [ "$status" -eq 0 ]; then
          exit 0
        fi
        if [ "$(date -u +%Y%m%d)" -lt 20260926 ]; then
          echo "warning: a numbered constraint failed during the rollout window"
          exit 0
        fi
        exit 1
