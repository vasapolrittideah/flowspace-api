apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  namespace: flowspace-local
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: adminer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adminer
    spec:
      automountServiceAccountToken: false
      containers:
        - name: adminer
          image: adminer:6.0.1
          env:
            - name: ADMINER_DEFAULT_SERVER
              value: workspace-postgres
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: adminer
  namespace: flowspace-local
spec:
  selector:
    app.kubernetes.io/name: adminer
  ports:
    - name: http
      port: 8080
      targetPort: http
