name: Close milestones

on:
  issues:
    types:
      - closed

permissions:
  issues: write

jobs:
  close:
    name: Close milestone
    if: github.event.issue.milestone != null && github.event.issue.milestone.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Close the milestone when it has no open Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MILESTONE: ${{ github.event.issue.milestone.number }}
        run: |
          open_issues=$(gh api "repos/$GITHUB_REPOSITORY/milestones/$MILESTONE" --jq .open_issues)
          if [ "$open_issues" -eq 0 ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/milestones/$MILESTONE" -f state=closed >/dev/null
          fi
