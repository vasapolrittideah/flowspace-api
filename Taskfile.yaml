version: '3.9'

vars:
  ACTIONLINT_VERSION: v1.7.7
  BUF_VERSION: v1.54.0
  CLUSTER_NAME: flowspace
  GITLEAKS_VERSION: v8.18.4
  GOLANGCI_LINT_VERSION: v2.13.2
  GOVULNCHECK_VERSION: v1.8.0
  REGISTRY_PORT: 5001
  SQLC_VERSION: v1.31.1

tasks:
  default:
    desc: Show available tasks
    silent: true
    cmds:
      - task --list

  cluster:create:
    desc: Create the local k3d cluster
    cmds:
      - k3d cluster create {{.CLUSTER_NAME | shellQuote}} --registry-create {{printf "%s-registry.localhost:0.0.0.0:%v" .CLUSTER_NAME .REGISTRY_PORT | shellQuote}}

  cluster:delete:
    desc: Delete the local k3d cluster
    cmds:
      - k3d cluster delete {{.CLUSTER_NAME | shellQuote}}

  cluster:start:
    desc: Start the local k3d cluster
    cmds:
      - k3d cluster start {{.CLUSTER_NAME | shellQuote}}

  cluster:stop:
    desc: Stop the local k3d cluster
    cmds:
      - k3d cluster stop {{.CLUSTER_NAME | shellQuote}}

  buf:
    desc: Run the pinned Buf CLI
    cmds:
      - go run github.com/bufbuild/buf/cmd/buf@{{.BUF_VERSION}} {{.CLI_ARGS}}

  sqlc:
    desc: Run the pinned sqlc CLI
    cmds:
      - go run github.com/sqlc-dev/sqlc/cmd/sqlc@{{.SQLC_VERSION}} {{.CLI_ARGS}}

  tools:install:
    desc: Install pinned project tools into bin
    env:
      GOBIN: '{{.ROOT_DIR}}/bin'
    cmds:
      - go install github.com/bufbuild/buf/cmd/buf@{{.BUF_VERSION}}
      - go install github.com/sqlc-dev/sqlc/cmd/sqlc@{{.SQLC_VERSION}}
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
      - go install github.com/rhysd/actionlint/cmd/actionlint@{{.ACTIONLINT_VERSION}}
      - go install github.com/zricethezav/gitleaks/v8@{{.GITLEAKS_VERSION}}
      - go install golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}}

  go:build:
    desc: Compile all Go packages
    cmds:
      - go build {{.CLI_ARGS}} ./...

  go:test:
    desc: Run all Go tests
    cmds:
      - go test {{.CLI_ARGS}} ./...

  go:tidy:
    desc: Update Go module files
    cmds:
      - go mod tidy {{.CLI_ARGS}}

  git:status:
    desc: Show the branch and working tree status
    cmds:
      - git status --short --branch

  git:diff:
    desc: Show Git changes
    cmds:
      - git diff {{.CLI_ARGS}}

  git:log:
    desc: Show recent Git history
    cmds:
      - git log --oneline --graph --decorate -20 {{.CLI_ARGS}}

  gh:auth:
    desc: Show GitHub CLI authentication status
    cmds:
      - gh auth status

  gh:issues:
    desc: List GitHub issues
    cmds:
      - gh issue list {{.CLI_ARGS}}

  gh:pr:
    desc: Show the current pull request
    cmds:
      - gh pr view {{.CLI_ARGS}}

  gh:checks:
    desc: Show pull request checks
    cmds:
      - gh pr checks {{.CLI_ARGS}}

  fmt:
    desc: Format Go code
    cmds:
      - golangci-lint fmt

  format:check:
    desc: Check Go formatting
    cmds:
      - golangci-lint fmt --diff

  lint:
    desc: Lint Go code
    cmds:
      - golangci-lint run ./...

  workflows:lint:
    desc: Check GitHub Actions workflow syntax and expressions
    cmds:
      - go run github.com/rhysd/actionlint/cmd/actionlint@{{.ACTIONLINT_VERSION}} -shellcheck= -pyflakes= .github/workflows/*.yml

  markdown:lint:
    desc: Lint Markdown
    cmds:
      - npx --yes markdownlint-cli2@0.23.2 "**/*.md"

  markdown:fix:
    desc: Fix Markdown lint issues
    cmds:
      - npx --yes markdownlint-cli2@0.23.2 --fix "**/*.md"

  markdown:links:
    desc: Check local Markdown links
    cmds:
      - node scripts/check-local-links.mjs {{.CLI_ARGS}}

  markdown:check:
    desc: Run all Markdown checks
    cmds:
      - task: markdown:lint
      - task: markdown:links

  constraints:floor:
    desc: Reject changes that weaken the quality floor
    cmds:
      - node scripts/constraint-check.mjs floor

  coverage:
    desc: Test and enforce coverage constraints
    cmds:
      - sh scripts/coverage.sh

  secrets:
    desc: Scan the working tree for secrets
    cmds:
      - go run github.com/zricethezav/gitleaks/v8@{{.GITLEAKS_VERSION}} detect --no-git --source . --redact --no-banner

  secrets:setup:
    desc: Create local password files without replacing existing values
    cmds:
      - node scripts/setup-secrets.mjs

  secrets:local-test:
    desc: Test local secret paths and Git and Docker exclusions
    cmds:
      - node --test scripts/local-secrets.test.mjs

  vuln:
    desc: Scan reachable Go dependencies for vulnerabilities
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}} ./...

  check:fast:
    desc: Run sub-five-second edit checks
    cmds:
      - node --test scripts/constraint-check.test.mjs
      - node --test scripts/check-local-links.test.mjs
      - task: constraints:floor
      - task: format:check
      - task: secrets

  check:task:
    desc: Run all local handoff checks
    cmds:
      - task: check:fast
      - task: lint
      - sh scripts/check-numbered-constraints.sh
