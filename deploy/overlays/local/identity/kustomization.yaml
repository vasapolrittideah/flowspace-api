apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flowspace-local
resources:
  - ../../../base/identity
  - postgres.yaml
  - network-policy.yaml
  - broker-bootstrap.yaml
  - mail-infra-network-policy.yaml
  - session-tls-sealed-secret.yaml
configMapGenerator:
  - name: identity-config
    literals:
      - ENVIRONMENT=local
      - HTTP_ADDR=:8080
      - INTERNAL_HTTP_ADDR=:8081
      - SESSION_GRPC_ADDR=:8082
      - SESSION_TLS_CERT_FILE=/keys/session/tls.crt
      - SESSION_TLS_KEY_FILE=/keys/session/tls.key
      - SESSION_CLIENT_CA_FILE=/keys/session/ca.crt
      - SESSION_CALLER_ALLOWLIST=urn:flowspace:service:workspace=cd609d87d5d544da608f725fa18056285e2c836b2303b2278f1e7e66e03499cf
      - HEALTH_ADDR=:8081
      - SIGNING_KEY_FILE=/keys/signing/private.pem
      - SIGNING_KEY_ID=local-1
      - TOKEN_ISSUER=urn:flowspace:identity:local
      - TOKEN_AUDIENCE=flowspace-api
      - CODE_VERIFIER_KEY_FILE=/keys/code/key
      - DELIVERY_KEY_FILE=/keys/delivery/key
      - BROKER_ADDR=redpanda:9092
      - BROKER_USERNAME=identity-worker
      - SCHEMA_REGISTRY_URL=http://redpanda:8081
      - DELIVERY_TOPIC=identity.email-delivery.v1
      - DELIVERY_GROUP=identity-mail-worker
      - MAIL_ADDR=mailpit-smtp:1025
      - MAIL_FROM=no-reply@flowspace.local
generatorOptions:
  disableNameSuffixHash: true
