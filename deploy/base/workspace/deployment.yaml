apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace-api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: workspace-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workspace-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      containers:
        - name: workspace-api
          image: flowspace/workspace-api
          envFrom:
            - configMapRef:
                name: workspace-config
            - secretRef:
                name: workspace-database
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
