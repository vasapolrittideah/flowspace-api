apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-postgres
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          env:
            - name: POSTGRES_DB
              value: identity
            - name: POSTGRES_USER
              value: identity
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: identity-database
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - identity
                - -d
                - identity
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - identity
                - -d
                - identity
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - identity
                - -d
                - identity
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: identity-postgres
spec:
  selector:
    app.kubernetes.io/name: identity-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
