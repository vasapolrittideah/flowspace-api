apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flowspace-local
resources:
  - network-policy.yaml
  - alloy-rbac.yaml
  - grafana-admin-sealed-secret.yaml
# Grafana loads each dashboard JSON file in this ConfigMap into the Flowspace
# folder. The name has no hash suffix, because grafana-values.yaml names it.
configMapGenerator:
  - name: grafana-dashboards-flowspace
    files:
      - dashboards/service-health.json
      - dashboards/event-delivery.json
      - dashboards/telemetry-stack.json
    options:
      disableNameSuffixHash: true
  # Grafana provisions the rule group, the contact point, the notification
  # policy, and the notification templates from this ConfigMap at startup.
  - name: grafana-alerting-flowspace
    files:
      - alerting/contact-points.json
      - alerting/notification-policies.json
      - alerting/notification-templates.json
      - alerting/rules.json
    options:
      disableNameSuffixHash: true
  # These templates replace the alert email layout of Grafana, so that the
  # body has only the message of the contact point.
  - name: grafana-emails-flowspace
    files:
      - alerting/emails/ng_alert_notification.html
      - alerting/emails/ng_alert_notification.txt
    options:
      disableNameSuffixHash: true
