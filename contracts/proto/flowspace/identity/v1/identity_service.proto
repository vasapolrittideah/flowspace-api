syntax = "proto3";

package flowspace.identity.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/vasapolrittideah/flowspace-api/gen/go/flowspace/identity/v1;identityv1";

service IdentityService {
  // Creates an unverified account and returns its first device session.
  // Rejects the Idempotency-Key HTTP header.
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse) {
    option (google.api.http) = {
      post: "/v1/accounts"
      body: "*"
    };
  }

  // Requests a new email code for the authenticated subject.
  // Requires one Authorization bearer header.
  rpc RequestEmailVerificationCode(RequestEmailVerificationCodeRequest) returns (RequestEmailVerificationCodeResponse) {
    option (google.api.http) = {
      post: "/v1/email-verification-codes"
      body: "*"
    };
  }

  // Verifies the authenticated subject's current email address.
  // Requires one Authorization bearer header.
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse) {
    option (google.api.http) = {
      post: "/v1/email-verifications"
      body: "*"
    };
  }

  // Requests a claim code without disclosing account eligibility.
  rpc RequestUnverifiedAccountClaimCode(RequestUnverifiedAccountClaimCodeRequest) returns (RequestUnverifiedAccountClaimCodeResponse) {
    option (google.api.http) = {
      post: "/v1/unverified-account-claim-codes"
      body: "*"
    };
  }

  // Replaces an unverified account after email ownership is proved.
  // Rejects the Idempotency-Key HTTP header.
  rpc ClaimUnverifiedAccount(ClaimUnverifiedAccountRequest) returns (ClaimUnverifiedAccountResponse) {
    option (google.api.http) = {
      post: "/v1/unverified-account-claims"
      body: "*"
    };
  }

  // Requests a password recovery code without disclosing account eligibility.
  rpc RequestPasswordResetCode(RequestPasswordResetCodeRequest) returns (RequestPasswordResetCodeResponse) {
    option (google.api.http) = {
      post: "/v1/password-reset-codes"
      body: "*"
    };
  }

  // Changes a password and revokes all sessions after email code proof.
  // Does not create a session or return tokens.
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse) {
    option (google.api.http) = {
      post: "/v1/password-resets"
      body: "*"
    };
  }

  // Creates a device session with an email address and password.
  // Rejects Idempotency-Key. Token responses require Cache-Control: no-store.
  rpc CreatePasswordSession(CreatePasswordSessionRequest) returns (CreatePasswordSessionResponse) {
    option (google.api.http) = {
      post: "/v1/password-sessions"
      body: "*"
    };
  }

  // Rotates a refresh token for one device session.
  // Rejects Idempotency-Key. Token responses require Cache-Control: no-store.
  rpc RefreshSession(RefreshSessionRequest) returns (RefreshSessionResponse) {
    option (google.api.http) = {
      post: "/v1/session-refreshes"
      body: "*"
    };
  }

  // Revokes the session in one validated access token.
  // Requires exactly one Authorization bearer header.
  rpc LogoutCurrentSession(LogoutCurrentSessionRequest) returns (LogoutCurrentSessionResponse) {
    option (google.api.http) = {
      post: "/v1/session-logouts"
      body: "*"
    };
  }

  // Revokes all sessions for the subject in one validated access token.
  // Requires exactly one Authorization bearer header.
  rpc LogoutAllSessions(LogoutAllSessionsRequest) returns (LogoutAllSessionsResponse) {
    option (google.api.http) = {
      post: "/v1/account-session-logouts"
      body: "*"
    };
  }

  // Starts a Google or GitHub login attempt for an API client.
  // Returns no Flowspace token. Rejects Idempotency-Key.
  // Responses require Cache-Control: no-store.
  rpc StartProviderLogin(StartProviderLoginRequest) returns (StartProviderLoginResponse) {
    option (google.api.http) = {
      post: "/v1/provider-login-attempts"
      body: "*"
    };
  }

  // Creates a device session from an attempt token and handoff code.
  // An unusable or colliding provider email returns FailedPrecondition.
  // Rejects Idempotency-Key. Token responses require Cache-Control: no-store.
  rpc CreateProviderSession(CreateProviderSessionRequest) returns (CreateProviderSessionResponse) {
    option (google.api.http) = {
      post: "/v1/provider-sessions"
      body: "*"
    };
  }

  // Proves the current session owner's identity with the account password.
  // Requires exactly 1 Authorization bearer header.
  rpc ReauthenticateWithPassword(ReauthenticateWithPasswordRequest) returns (ReauthenticateWithPasswordResponse) {
    option (google.api.http) = {
      post: "/v1/password-reauthentications"
      body: "*"
    };
  }

  // Requests a re-authentication code for the subject's current verified email.
  // Requires exactly 1 Authorization bearer header.
  rpc RequestReauthenticationCode(RequestReauthenticationCodeRequest) returns (RequestReauthenticationCodeResponse) {
    option (google.api.http) = {
      post: "/v1/reauthentication-codes"
      body: "*"
    };
  }

  // Proves the current session owner's identity with a re-authentication code.
  // Requires exactly 1 Authorization bearer header.
  rpc ReauthenticateWithCode(ReauthenticateWithCodeRequest) returns (ReauthenticateWithCodeResponse) {
    option (google.api.http) = {
      post: "/v1/code-reauthentications"
      body: "*"
    };
  }

  // Starts a provider proof for the subject and session of the access token.
  // Requires exactly 1 Authorization bearer header. Rejects Idempotency-Key.
  rpc StartProviderReauthentication(StartProviderReauthenticationRequest) returns (StartProviderReauthenticationResponse) {
    option (google.api.http) = {
      post: "/v1/provider-reauthentication-attempts"
      body: "*"
    };
  }

  // Completes a linked provider proof from the session that started the attempt.
  // Requires exactly 1 Authorization bearer header. Returns no Flowspace token.
  rpc CompleteProviderReauthentication(CompleteProviderReauthenticationRequest) returns (CompleteProviderReauthenticationResponse) {
    option (google.api.http) = {
      post: "/v1/provider-reauthentications"
      body: "*"
    };
  }

  // Lists the active sessions of the subject in 1 validated access token.
  // Requires exactly 1 Authorization bearer header.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option (google.api.http) = {get: "/v1/sessions"};
  }

  // Revokes 1 other session of the subject in 1 validated access token.
  // Requires exactly 1 Authorization bearer header and an open
  // re-authentication window.
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse) {
    option (google.api.http) = {
      post: "/v1/sessions/{session_id}:revoke"
      body: "*"
    };
  }

  // Returns the current email state for an active session; inactive sessions
  // return Unauthenticated.
  // Requires an authenticated service caller and has no public HTTP route.
  rpc CheckSession(CheckSessionRequest) returns (CheckSessionResponse);
}

message CreateAccountRequest {
  string email = 1 [(google.api.field_behavior) = REQUIRED];
  string password = 2 [(google.api.field_behavior) = REQUIRED];
}

message CreateAccountResponse {
  string subject = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  optional bool email_verified = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string access_token = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string refresh_token = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp access_token_expires_at = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message RequestEmailVerificationCodeRequest {}

message RequestEmailVerificationCodeResponse {
  bool accepted = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message VerifyEmailRequest {
  string code = 1 [(google.api.field_behavior) = REQUIRED];
}

message VerifyEmailResponse {
  bool email_verified = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message RequestUnverifiedAccountClaimCodeRequest {
  string email = 1 [(google.api.field_behavior) = REQUIRED];
}

message RequestUnverifiedAccountClaimCodeResponse {
  bool accepted = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ClaimUnverifiedAccountRequest {
  string email = 1 [(google.api.field_behavior) = REQUIRED];
  string code = 2 [(google.api.field_behavior) = REQUIRED];
  string new_password = 3 [(google.api.field_behavior) = REQUIRED];
}

message ClaimUnverifiedAccountResponse {
  string subject = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  bool email_verified = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string access_token = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string refresh_token = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp access_token_expires_at = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message RequestPasswordResetCodeRequest {
  string email = 1 [(google.api.field_behavior) = REQUIRED];
}

message RequestPasswordResetCodeResponse {
  bool accepted = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ResetPasswordRequest {
  string email = 1 [(google.api.field_behavior) = REQUIRED];
  string code = 2 [(google.api.field_behavior) = REQUIRED];
  string new_password = 3 [(google.api.field_behavior) = REQUIRED];
}

message ResetPasswordResponse {
  bool password_changed = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  bool sessions_revoked = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message CreatePasswordSessionRequest {
  string email = 1 [(google.api.field_behavior) = REQUIRED];
  string password = 2 [(google.api.field_behavior) = REQUIRED];
}

message CreatePasswordSessionResponse {
  string subject = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  optional bool email_verified = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string access_token = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string refresh_token = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp access_token_expires_at = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp refresh_token_expires_at = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp session_expires_at = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

enum Provider {
  PROVIDER_UNSPECIFIED = 0;
  PROVIDER_GOOGLE = 1;
  PROVIDER_GITHUB = 2;
}

message StartProviderLoginRequest {
  Provider provider = 1 [(google.api.field_behavior) = REQUIRED];
}

message StartProviderLoginResponse {
  string authorization_url = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string attempt_token = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp attempt_expires_at = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message CreateProviderSessionRequest {
  string attempt_token = 1 [(google.api.field_behavior) = REQUIRED];
  string handoff_code = 2 [(google.api.field_behavior) = REQUIRED];
}

message CreateProviderSessionResponse {
  string subject = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  optional bool email_verified = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string access_token = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string refresh_token = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp access_token_expires_at = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp refresh_token_expires_at = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp session_expires_at = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ReauthenticateWithPasswordRequest {
  string password = 1 [(google.api.field_behavior) = REQUIRED];
}

message ReauthenticateWithPasswordResponse {
  google.protobuf.Timestamp reauthentication_expires_at = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message RequestReauthenticationCodeRequest {}

message RequestReauthenticationCodeResponse {
  bool accepted = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ReauthenticateWithCodeRequest {
  // Exactly 6 ASCII digits. Leading zeroes are significant.
  string code = 1 [(google.api.field_behavior) = REQUIRED];
}

message ReauthenticateWithCodeResponse {
  google.protobuf.Timestamp reauthentication_expires_at = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message StartProviderReauthenticationRequest {
  // Accepts only PROVIDER_GOOGLE and PROVIDER_GITHUB.
  // PROVIDER_UNSPECIFIED and unknown values are malformed.
  Provider provider = 1 [(google.api.field_behavior) = REQUIRED];
}

message StartProviderReauthenticationResponse {
  string authorization_url = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // A secret token with at least 128 random bits.
  string attempt_token = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp attempt_expires_at = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message CompleteProviderReauthenticationRequest {
  string attempt_token = 1 [(google.api.field_behavior) = REQUIRED];
  string handoff_code = 2 [(google.api.field_behavior) = REQUIRED];
}

message CompleteProviderReauthenticationResponse {
  google.protobuf.Timestamp reauthentication_expires_at = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message RefreshSessionRequest {
  string refresh_token = 1 [(google.api.field_behavior) = REQUIRED];
}

message RefreshSessionResponse {
  string access_token = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string refresh_token = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp access_token_expires_at = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp refresh_token_expires_at = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp session_expires_at = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message LogoutCurrentSessionRequest {}

message LogoutCurrentSessionResponse {
  bool revoked = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message LogoutAllSessionsRequest {}

message LogoutAllSessionsResponse {
  bool revoked = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

enum SignInMethod {
  // The session started before Identity recorded the sign-in method.
  SIGN_IN_METHOD_UNSPECIFIED = 0;
  SIGN_IN_METHOD_PASSWORD = 1;
  SIGN_IN_METHOD_GOOGLE = 2;
  SIGN_IN_METHOD_GITHUB = 3;
}

message Session {
  string session_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  bool current = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  SignInMethod sign_in_method = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp created_at = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The value uses IPv4 dotted or IPv6 text form, or is empty when the address
  // is unknown.
  string created_ip_address = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The value has at most 512 bytes, or is empty.
  string created_user_agent = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Examples are "Chrome on macOS" and "Unknown device".
  string created_device = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The time of the last successful refresh, or created_at before the first
  // refresh.
  google.protobuf.Timestamp last_used_at = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The value uses the same form as created_ip_address.
  string last_used_ip_address = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The value has at most 512 bytes, or is empty.
  string last_used_user_agent = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  string last_used_device = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The value is the earlier of the idle expiry and the absolute expiry.
  google.protobuf.Timestamp expires_at = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Sessions are ordered by last_used_at from newest to oldest, then by
// session_id in ascending byte order.
message ListSessionsRequest {
  // A value of 0 uses the default of 20. The maximum is 100.
  int32 page_size = 1;
  // An opaque token that works only for the subject that received it.
  string page_token = 2;
}

message ListSessionsResponse {
  repeated Session sessions = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string next_page_token = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message RevokeSessionRequest {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message RevokeSessionResponse {}

message CheckSessionRequest {
  string subject = 1 [(google.api.field_behavior) = REQUIRED];
  string session_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message CheckSessionResponse {
  bool email_verified = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}
