name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CONSTRAINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  floor:
    name: Constraint floor
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check diff whitespace
        run: git diff --check "$CONSTRAINT_BASE" HEAD
      - name: Test constraint checker
        run: node --test scripts/constraint-check.test.mjs
      - name: Test local session TLS rotation
        run: sh scripts/rotate-identity-session-tls-local.test.sh
      - name: Enforce constraint floor
        run: node scripts/constraint-check.mjs floor --base "$CONSTRAINT_BASE"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes= .github/workflows/*.yml
      - name: Scan for secrets
        run: |
          go run github.com/zricethezav/gitleaks/v8@v8.18.4 detect --no-git --source . --redact --no-banner
          go run github.com/zricethezav/gitleaks/v8@v8.18.4 detect --redact --no-banner

  quality:
    name: Numbered constraints
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - id: coverage
        name: Test and check coverage
        continue-on-error: true
        run: |
          profile="$(mktemp)"
          trap 'rm -f "$profile"' EXIT
          go test -tags=integration -coverpkg=./... ./... -coverprofile="$profile"
          node scripts/constraint-check.mjs coverage --base "$CONSTRAINT_BASE" --profile "$profile" --changed-min 80 --total-min 25
      - id: dependencies
        name: Scan reachable dependencies
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Apply warning rollout
        if: always()
        env:
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
        run: |
          if [[ "$COVERAGE_OUTCOME" == success && "$DEPENDENCIES_OUTCOME" == success ]]; then
            exit 0
          fi
          if [[ "$(date -u +%F)" < 2026-09-26 ]]; then
            echo "::warning::One or more numbered constraints failed during the rollout window."
            exit 0
          fi
          echo "::error::One or more numbered constraints failed."
          exit 1

  go-lint:
    name: Lint Go code
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Lint Go
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.13.2
          args: ./...
      - name: Check Go formatting
        run: golangci-lint fmt --diff

  markdown-lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test local link checker
        run: node --test scripts/check-local-links.test.mjs
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"
      - name: Check local Markdown links
        run: node scripts/check-local-links.mjs

  contracts:
    name: Contract checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changes
        name: Find contract changes
        run: |
          changed_files="$(git diff --name-only "$CONSTRAINT_BASE" HEAD)"
          if grep -Eq '^(contracts/(proto|events)/|gen/go/|buf(\.gen)?\.yaml$|buf\.lock$|Taskfile\.yaml$|\.github/workflows/ci\.yml$)' <<< "$changed_files"; then
            echo 'proto=true' >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(services/(identity|workspace)/db/(migrations|queries)/|services/(identity|workspace)/internal/adapter/out/postgres/sqlc/|sqlc\.yaml$|Taskfile\.yaml$|\.github/workflows/ci\.yml$)' <<< "$changed_files"; then
            echo 'sql=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Go
        if: steps.changes.outputs.proto == 'true' || steps.changes.outputs.sql == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check Protobuf contracts and generated code
        if: steps.changes.outputs.proto == 'true'
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.54.0
          "$(go env GOPATH)/bin/buf" lint
          "$(go env GOPATH)/bin/buf" breaking --against ".git#commit=$CONSTRAINT_BASE"
          "$(go env GOPATH)/bin/buf" generate
          if [[ -n "$(git status --porcelain -- gen/go)" ]]; then
            git status --short -- gen/go
            exit 1
          fi
      - name: Check SQL generation
        if: steps.changes.outputs.sql == 'true'
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          "$(go env GOPATH)/bin/sqlc" generate
          if [[ -n "$(git status --porcelain -- services/identity/internal/adapter/out/postgres/sqlc services/workspace/internal/adapter/out/postgres/sqlc)" ]]; then
            git status --short -- services/identity/internal/adapter/out/postgres/sqlc services/workspace/internal/adapter/out/postgres/sqlc
            exit 1
          fi
