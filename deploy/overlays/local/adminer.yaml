apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  namespace: flowspace-local
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: adminer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adminer
    spec:
      automountServiceAccountToken: false
      containers:
        - name: adminer
          image: adminer:6.0.1
          env:
            - name: ADMINER_DEFAULT_SERVER
              value: workspace-postgres
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: autologin
              mountPath: /var/www/html/plugins-enabled/local-autologin.php
              subPath: local-autologin.php
              readOnly: true
            - name: database-passwords
              mountPath: /run/secrets/adminer
              readOnly: true
      volumes:
        - name: autologin
          configMap:
            name: adminer-autologin
        - name: database-passwords
          projected:
            sources:
              - secret:
                  name: workspace-database
                  items:
                    - key: PGPASSWORD
                      path: workspace-password
              - secret:
                  name: identity-database
                  items:
                    - key: POSTGRES_PASSWORD
                      path: identity-password
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: adminer
  namespace: flowspace-local
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: adminer
  policyTypes:
    - Ingress
